# Shopify app configuration. Push it with:  shopify app deploy
# Hosted on Railway (Singapore).

client_id = "3b858aa1ec536fea2e3c1086e4470115"
name = "ShipBridge for Pathao Courier"
application_url = "https://shipbridge-production-7b96.up.railway.app"
embedded = true

[access_scopes]
# Orders contain customer names/phones/addresses -> also request
# "Protected customer data" access in the Partner Dashboard.
# read/write_draft_orders: open draft orders show on hold; sending one completes it into an order.
scopes = "read_orders,write_orders,read_fulfillments,write_fulfillments,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_draft_orders,write_draft_orders"

[auth]
redirect_urls = [ "https://shipbridge-production-7b96.up.railway.app/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Mandatory privacy webhooks (required for the App Store)
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[pos]
embedded = false

[build]
include_config_on_deploy = true
