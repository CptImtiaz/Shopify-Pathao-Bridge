# Shopify app configuration. Push it with:  shopify app deploy
# Hosted on Railway (Singapore).

client_id = "3b858aa1ec536fea2e3c1086e4470115"
name = "ShipBridge: BD Courier Sync"
application_url = "https://autocourier.nimtechit.com"
embedded = true

[access_scopes]
# Orders contain customer names/phones/addresses -> also request
# "Protected customer data" access in the Partner Dashboard.
scopes = "read_orders,write_orders,read_fulfillments,write_fulfillments,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[auth]
redirect_urls = [ "https://autocourier.nimtechit.com/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Mandatory privacy webhooks (required for the App Store)
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[pos]
embedded = false

[build]
include_config_on_deploy = true
